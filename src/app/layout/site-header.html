<header>
  <div class="container bar">
    <a routerLink="/" class="brand">Vane</a>

    <nav aria-label="Main">
      <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">Dashboard</a>
      <a routerLink="/monitors" routerLinkActive="active" ariaCurrentWhenActive="page">Monitors</a>
      <a routerLink="/shop" routerLinkActive="active" ariaCurrentWhenActive="page">Shop</a>
      <a routerLink="/about" routerLinkActive="active" ariaCurrentWhenActive="page">About</a>
      <a routerLink="/contact" routerLinkActive="active" ariaCurrentWhenActive="page">Contact</a>
    </nav>

    <div class="tools">
      <div class="units" role="group" aria-label="Temperature unit">
        @for (unit of units; track unit) {
          <button
            type="button"
            class="mono"
            [attr.aria-pressed]="prefs.temperatureUnit() === unit"
            (click)="prefs.temperatureUnit.set(unit)"
          >
            °{{ unit }}
          </button>
        }
      </div>
      <button
        type="button"
        class="theme"
        [class.is-dark]="theme.mode() === 'dark'"
        [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="toggleTheme($event)"
      >
        <app-icon class="sun" name="sun" [size]="18" />
        <app-icon class="moon" name="moon" [size]="18" />
      </button>
    </div>
  </div>
</header>
